{% extends "base.html" %}

{% block title %}
    Edit {{ document.title }} | Vaultora
{% endblock %}


{% block content %}

<div>

    <p>
        <a href="{% url 'documents:detail' document.pk %}">
            ← Back to Document
        </a>
    </p>


    <h1>
        Edit Document
    </h1>

    <p>
        Update the information of your document.
    </p>


    <hr>


    <form
        method="post"
        enctype="multipart/form-data"
    >

        {% csrf_token %}


        {{ form.as_p }}


        <button type="submit">
            Save Changes
        </button>


        <a href="{% url 'documents:detail' document.pk %}">
            Cancel
        </a>

    </form>

</div>

{% endblock %}
